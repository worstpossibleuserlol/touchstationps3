name: Bug Report
description: Report a problem with TouchStation.
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: "Please describe the problem clearly and include your device details."
  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: What went wrong?
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone reproduce the problem?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Infinix Note Edge
    validations:
      required: false
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: e.g. Android 16
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: TouchStation version
      placeholder: e.g. 5.0.0 Final
    validations:
      required: false
  - type: textarea
    id: screenshots-logs
    attributes:
      label: Screenshots or logs
      description: Add screenshots or relevant logs, if available.
    validations:
      required: false
