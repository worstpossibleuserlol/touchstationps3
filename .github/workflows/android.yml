name: TouchStation PS3 3.0.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touchstation-ps3-3-build
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Rebrand and verify native PS3 emulator APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout TouchStation
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android build tools
        uses: android-actions/setup-android@v3

      - name: Install zipalign and apksigner
        run: |
          sdkmanager --install "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Download pinned upstream PS3 emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/ARMSX2/ARMSX3/releases/download/1.6.4/ARMSX3-1.6.4-a15-armv8.2-sdk35.apk" \
            --output "$RUNNER_TEMP/upstream/armsx3.apk"

          actual_size="$(stat -c %s "$RUNNER_TEMP/upstream/armsx3.apk")"
          echo "Upstream APK bytes: $actual_size"
          test "$actual_size" -gt 70000000

          unzip -Z1 "$RUNNER_TEMP/upstream/armsx3.apk" > "$RUNNER_TEMP/upstream/entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-core.so" "$RUNNER_TEMP/upstream/entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-jni.so" "$RUNNER_TEMP/upstream/entries.txt"
          echo "Verified the bundled ARM64 RPCS3-derived core and JNI bridge."

      - name: Install APKTool and image tooling
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" \
            --output "$RUNNER_TEMP/apktool.jar"
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/apktool.jar" | sha256sum --check

          python3 -m venv "$RUNNER_TEMP/python-env"
          "$RUNNER_TEMP/python-env/bin/pip" install --disable-pip-version-check Pillow==12.0.0
          echo "$RUNNER_TEMP/python-env/bin" >> "$GITHUB_PATH"

      - name: Decode upstream APK
        run: |
          java -jar "$RUNNER_TEMP/apktool.jar" d --force \
            "$RUNNER_TEMP/upstream/armsx3.apk" \
            --output "$RUNNER_TEMP/decoded"

      - name: Apply TouchStation branding and version
        run: |
          python tools/rebrand_apk.py \
            --decoded "$RUNNER_TEMP/decoded" \
            --logo-b64 assets/touchstation-logo.webp.b64

      - name: Rebuild APK
        run: |
          java -jar "$RUNNER_TEMP/apktool.jar" b \
            "$RUNNER_TEMP/decoded" \
            --output "$RUNNER_TEMP/touchstation-unsigned.apk"

      - name: Align and sign sideload APK
        shell: bash
        run: |
          set -euo pipefail
          zipalign -f -p 4 \
            "$RUNNER_TEMP/touchstation-unsigned.apk" \
            "$RUNNER_TEMP/touchstation-aligned.apk"

          signing_password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/touchstation-ci.jks" \
            -storepass "$signing_password" \
            -keypass "$signing_password" \
            -alias touchstation \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=TouchStation PS3, O=TouchStation, C=ID"

          apksigner sign \
            --ks "$RUNNER_TEMP/touchstation-ci.jks" \
            --ks-key-alias touchstation \
            --ks-pass "pass:$signing_password" \
            --key-pass "pass:$signing_password" \
            --out "$RUNNER_TEMP/TouchStation-PS3-v3.0.0-arm64.apk" \
            "$RUNNER_TEMP/touchstation-aligned.apk"

          apksigner verify --verbose "$RUNNER_TEMP/TouchStation-PS3-v3.0.0-arm64.apk"
          zipalign -c -v 4 "$RUNNER_TEMP/TouchStation-PS3-v3.0.0-arm64.apk"

      - name: Verify branding, version and native engine
        shell: bash
        run: |
          set -euo pipefail
          aapt dump badging "$RUNNER_TEMP/TouchStation-PS3-v3.0.0-arm64.apk" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "application-label:'TouchStation PS3'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='3.0.0'" "$RUNNER_TEMP/badging.txt"

          unzip -Z1 "$RUNNER_TEMP/TouchStation-PS3-v3.0.0-arm64.apk" > "$RUNNER_TEMP/final-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-core.so" "$RUNNER_TEMP/final-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-jni.so" "$RUNNER_TEMP/final-entries.txt"
          ls -lh "$RUNNER_TEMP/TouchStation-PS3-v3.0.0-arm64.apk"

      - name: Upload TouchStation PS3 APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchStation-PS3-v3.0.0-arm64
          path: ${{ runner.temp }}/TouchStation-PS3-v3.0.0-arm64.apk
          if-no-files-found: error
          retention-days: 90
