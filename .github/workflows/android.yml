name: TouchStation 10.0.0 Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Keep release builds queued so the latest branding fix can finish.
concurrency:
  group: touchstation-10-0-release
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build TouchStation Android app with native PS3 engine
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout TouchStation
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # API 37 is published by Google as android-37.0. Gradle 9.4 / AGP
          # resolves compileSdk 37 from platforms/android-37, so add the documented alias.
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" --sdk_root="$SDK_ROOT"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
          echo "$SDK_ROOT/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Install pinned Python image tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/touchstation-python"
          "$RUNNER_TEMP/touchstation-python/bin/pip" install --disable-pip-version-check Pillow==12.0.0
          echo "$RUNNER_TEMP/touchstation-python/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned upstream Android application source
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="$RUNNER_TEMP/armsx3-source"
          COMMIT="482d35b6a9f2eee61cdc6c0820a2d57392b235e6"
          git clone --filter=blob:none --no-checkout https://github.com/ARMSX2/ARMSX3.git "$UPSTREAM"
          git -C "$UPSTREAM" fetch --depth=1 origin "$COMMIT"
          git -C "$UPSTREAM" checkout --detach FETCH_HEAD
          # Include the complete upstream tree and exact submodule source so the
          # corresponding-source release archive is complete, not just the Android UI.
          git -C "$UPSTREAM" submodule update --init --recursive --depth 1
          test -f "$UPSTREAM/android/armsx3-ui/app/src/main/java/com/armsx2/ui/settings/PerformanceTab.kt"
          echo "Upstream source and submodules pinned to $COMMIT"

      - name: Download matching upstream ARM64 native libraries
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_APK="$RUNNER_TEMP/armsx3-1.6.4.apk"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/ARMSX2/ARMSX3/releases/download/1.6.4/ARMSX3-1.6.4-a15-armv8.2-sdk35.apk" \
            --output "$UPSTREAM_APK"

          unzip -Z1 "$UPSTREAM_APK" > "$RUNNER_TEMP/upstream-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-core.so" "$RUNNER_TEMP/upstream-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-jni.so" "$RUNNER_TEMP/upstream-entries.txt"
          mkdir -p "$RUNNER_TEMP/native-libs"
          unzip -oq "$UPSTREAM_APK" "lib/arm64-v8a/*.so" -d "$RUNNER_TEMP/native-libs"

          APP="$RUNNER_TEMP/armsx3-source/android/armsx3-ui/app"
          mkdir -p "$APP/src/main/jniLibs/arm64-v8a" "$APP/src/github/jniLibs/arm64-v8a"
          cp "$RUNNER_TEMP/native-libs"/lib/arm64-v8a/*.so "$APP/src/main/jniLibs/arm64-v8a/"
          if [ -f "$APP/src/main/jniLibs/arm64-v8a/libarmsx3_lsfg.so" ]; then
            mv "$APP/src/main/jniLibs/arm64-v8a/libarmsx3_lsfg.so" "$APP/src/github/jniLibs/arm64-v8a/"
          fi

          test -s "$APP/src/main/jniLibs/arm64-v8a/libarmsx3-core.so"
          test -s "$APP/src/main/jniLibs/arm64-v8a/libarmsx3-jni.so"
          test -s "$APP/src/main/jniLibs/arm64-v8a/libEGL_angle.so"
          test -s "$APP/src/main/jniLibs/arm64-v8a/libGLESv2_angle.so"
          echo "Verified and staged native PS3 engine, JNI bridge, and graphics libraries."

      - name: Validate TouchStation build script
        run: python3 -m py_compile tools/prepare_source_build.py tools/touchstation_control_center.py tools/touchstation_v7_performance.py tools/touchstation_v8_suite.py tools/touchstation_v9_auto.py tools/touchstation_v10_suite.py tools/add_gpl_modification_notices.py

      - name: Apply TouchStation branding, pause menu, controls and advanced settings
        run: |
          python tools/prepare_source_build.py \
            --source "$RUNNER_TEMP/armsx3-source/android/armsx3-ui"
          python tools/touchstation_control_center.py \
            --source "$RUNNER_TEMP/armsx3-source/android/armsx3-ui"
          python tools/touchstation_v7_performance.py \
            --source "$RUNNER_TEMP/armsx3-source/android/armsx3-ui"
          python tools/touchstation_v8_suite.py \
            --source "$RUNNER_TEMP/armsx3-source/android/armsx3-ui"
          python tools/touchstation_v9_auto.py \
            --source "$RUNNER_TEMP/armsx3-source/android/armsx3-ui"
          python tools/touchstation_v10_suite.py \
            --source "$RUNNER_TEMP/armsx3-source/android/armsx3-ui"
          python tools/add_gpl_modification_notices.py \
            --source "$RUNNER_TEMP/armsx3-source/android/armsx3-ui"

          # Package the exact patched source and all build scripts for GPL source distribution.
          UPSTREAM="$RUNNER_TEMP/armsx3-source"
          mkdir -p "$UPSTREAM/touchstation-build/tools" "$UPSTREAM/touchstation-build/.github/workflows"
          cp LICENSE README.md THIRD_PARTY_NOTICES.md SOURCE_DISTRIBUTION.md "$UPSTREAM/touchstation-build/"
          cp tools/*.py "$UPSTREAM/touchstation-build/tools/"
          cp .github/workflows/android.yml "$UPSTREAM/touchstation-build/.github/workflows/"
          tar --exclude='.git' --exclude='*/.git' --exclude='*/build' --exclude='*/.gradle' \
            -czf "$RUNNER_TEMP/TouchStation-v10.0.0-corresponding-source.tar.gz" \
            -C "$RUNNER_TEMP" armsx3-source
          sha256sum "$RUNNER_TEMP/TouchStation-v10.0.0-corresponding-source.tar.gz" \
            > "$RUNNER_TEMP/TouchStation-v10.0.0-corresponding-source.tar.gz.sha256"
          test -s "$RUNNER_TEMP/TouchStation-v10.0.0-corresponding-source.tar.gz"
          tar -tzf "$RUNNER_TEMP/TouchStation-v10.0.0-corresponding-source.tar.gz" \
            > "$RUNNER_TEMP/source-archive-entries.txt"
          grep -Fq "armsx3-source/TOUCHSTATION_MODIFICATIONS.md" "$RUNNER_TEMP/source-archive-entries.txt"
          grep -Fq "armsx3-source/touchstation-build/tools/add_gpl_modification_notices.py" "$RUNNER_TEMP/source-archive-entries.txt"
          grep -Fq "armsx3-source/touchstation-build/THIRD_PARTY_NOTICES.md" "$RUNNER_TEMP/source-archive-entries.txt"
          grep -Fq "armsx3-source/touchstation-build/SOURCE_DISTRIBUTION.md" "$RUNNER_TEMP/source-archive-entries.txt"

          APP="$RUNNER_TEMP/armsx3-source/android/armsx3-ui/app"
          DRAWER="$APP/src/main/java/com/armsx2/navigation/NavigationDrawer.kt"
          ABOUT="$APP/src/main/java/com/armsx2/ui/about/AboutScreen.kt"
          EMULATION_MENU="$APP/src/main/java/com/armsx2/ui/emulation/EmulationMenuScreen.kt"
          RUNTIME="$APP/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt"

          # Verify TouchStation-owned drawer links and About branding in the generated source.
          grep -Fq 'internal const val GithubUrl = "https://github.com/worstpossibleuserlol/touchstationps3"' "$DRAWER"
          grep -Fq 'internal const val ReportBugUrl = "https://github.com/worstpossibleuserlol/touchstationps3/issues/new?template=bug_report.yml"' "$DRAWER"
          grep -Fq 'displayTitle = "GitHub"' "$DRAWER"
          grep -Fq 'displayTitle = "Report a Bug"' "$DRAWER"
          grep -Fq 'displayTitle = "About TouchStation"' "$DRAWER"
          if grep -Eq 'discord.gg/|armsx2.net/armsx3' "$DRAWER"; then
            echo "Upstream Discord or website link remains in the TouchStation drawer."
            exit 1
          fi
          grep -Fq 'title = "About TouchStation"' "$ABOUT"
          grep -Fq 'TouchStation project' "$ABOUT"
          grep -Fq 'Upstream emulator base' "$ABOUT"
          grep -Fq 'TouchStation is an independent downstream project.' "$ABOUT"
          grep -Fq 'controllerId = "about.back"' "$ABOUT"
          grep -Fq '"about.project.$repository"' "$ABOUT"
          XMB="$APP/src/main/java/com/armsx2/ui/xmb/XmbHome.kt"
          grep -Fq 'openExternalUrl(context, ReportBugUrl)' "$XMB"
          grep -Fq 'openExternalUrl(context, GithubUrl)' "$XMB"
          grep -Fq 'title = "TouchStation"' "$XMB"
          if grep -Eq 'DiscordUrl|WebsiteUrl' "$XMB"; then
            echo "Legacy Discord or Website URL remains in the TouchStation XMB."
            exit 1
          fi

          # Regression checks for controller-only navigation paths; no gameplay button is rebound.
          grep -Fq 'controllerFocusable(controllerId' "$DRAWER"
          grep -Fq 'modifier = modifier.controllerFocusable("pause.compact.$title", onConfirm = onClick)' "$EMULATION_MENU"
          grep -Fq 'CompactAction(str("action.allSettings"), "⚙", Modifier.fillMaxWidth(), viewModel::openFullSettings)' "$EMULATION_MENU"
          grep -Fq 'KeyEvent.KEYCODE_BUTTON_Y -> { if (down) emu.open(com.armsx2.ui.emulation.EmulationMenuTab.Options); true }' "$RUNTIME"

          grep -Fq 'add(MenuAction("Exit Game"' "$APP/src/main/java/com/armsx2/ui/emulation/EmulationMenuScreen.kt"
          grep -Fq 'settings.action.resumeGame' "$APP/src/main/java/com/armsx2/ui/settingshub/SettingsScreen.kt"
          grep -Fq 'settings.action.restartGame' "$APP/src/main/java/com/armsx2/ui/settingshub/SettingsScreen.kt"
          grep -Fq 'settings.action.saveAndExit' "$APP/src/main/java/com/armsx2/ui/settingshub/SettingsScreen.kt"
          grep -Fq 'settings.action.exitGame' "$APP/src/main/java/com/armsx2/ui/settingshub/SettingsScreen.kt"
          grep -Fq 'Save State & Exit' "$APP/src/main/java/com/armsx2/ui/settingshub/SettingsScreen.kt"
          grep -Fq 'MainActivityRuntime.restart()' "$APP/src/main/java/com/armsx2/ui/settingshub/SettingsScreen.kt"
          grep -Fq 'MainActivityRuntime.closeGame(saveAutosave = true)' "$APP/src/main/java/com/armsx2/ui/settingshub/SettingsScreen.kt"
          grep -Fq 'MainActivityRuntime.closeGame()' "$APP/src/main/java/com/armsx2/ui/settingshub/SettingsScreen.kt"
          grep -Fq 'Exit Game' "$APP/src/main/java/com/armsx2/ui/xmb/XmbInGame.kt"
          grep -Fq 'TouchStation Advanced Settings (26)' "$APP/src/main/java/com/armsx2/ui/settings/PerformanceTab.kt"
          grep -Fq 'TouchStationPerformanceMonitor()' "$APP/src/main/java/com/armsx2/ui/settings/PerformanceTab.kt"
          grep -Fq 'TouchStationControlCenter()' "$APP/src/main/java/com/armsx2/ui/settings/PerformanceTab.kt"
          PPU_MONITOR="$APP/src/main/java/com/armsx2/ui/settings/TouchStationPpuMonitor.kt"
          grep -Fq 'TouchStation PPU Monitor' "$PPU_MONITOR"
          grep -Fq 'Show in-game performance overlay' "$PPU_MONITOR"
          grep -Fq 'Overlay position' "$PPU_MONITOR"
          grep -Fq 'Framerate graph' "$PPU_MONITOR"
          grep -Fq 'Frametime graph' "$PPU_MONITOR"
          grep -Fq 'Rpcs3Settings.setOverlayPosition(index)' "$PPU_MONITOR"
          grep -Fq 'setOsdMode(OsdMode.Full)' "$APP/src/main/java/com/armsx2/ui/InGameOverlay.kt"
          grep -Fq 'touchstation.v7.performanceOverlay.migrated' "$APP/src/main/java/com/armsx2/ui/InGameOverlay.kt"
          grep -Fq 'TouchStationPpuMonitor(settings = s)' "$APP/src/main/java/com/armsx2/ui/settings/PerformanceTab.kt"
          grep -Fq 'TouchStation8MonitoringSuite(settings = s)' "$APP/src/main/java/com/armsx2/ui/settings/PerformanceTab.kt"
          V9_SUITE="$APP/src/main/java/com/armsx2/ui/settings/TouchStation9AutoOptimizationSuite.kt"
          grep -Fq 'TouchStation 9.0 Auto Optimization Suite' "$V9_SUITE"
          grep -Fq 'Automatic Device Detection' "$V9_SUITE"
          grep -Fq 'Auto Configuration Engine' "$V9_SUITE"
          grep -Fq 'Adaptive Resolution Guard' "$V9_SUITE"
          grep -Fq 'Game-Specific Profiles' "$V9_SUITE"
          grep -Fq 'Compatibility Checker 2.0' "$V9_SUITE"
          grep -Fq 'Shader Cache Manager' "$V9_SUITE"
          grep -Fq 'Crash Recovery / Safe Mode' "$V9_SUITE"
          grep -Fq 'Hardware Benchmark & Recommendation' "$V9_SUITE"
          grep -Fq 'getHistoricalProcessExitReasons' "$V9_SUITE"
          grep -Fq 'ApplicationExitInfo.REASON_CRASH_NATIVE' "$V9_SUITE"
          SUITE="$APP/src/main/java/com/armsx2/ui/settings/TouchStation8MonitoringSuite.kt"
          ! grep -Fq 'import androidx.compose.foundation.layout.weight' "$PPU_MONITOR"
          ! grep -Fq 'padCount.intValue' "$SUITE"
          grep -Fq 'padCount.value.toString()' "$SUITE"
          grep -Fq 'SPU Monitor' "$SUITE"
          grep -Fq 'RSX Graphics Monitor' "$SUITE"
          grep -Fq 'Controller Center' "$SUITE"
          grep -Fq 'Game Compatibility and Profiles' "$SUITE"
          grep -Fq 'Stability, Crash Diagnostics and Audio / Display' "$SUITE"
          grep -Fq 'ui.osdMode.game.' "$APP/src/main/java/com/armsx2/ui/InGameOverlay.kt"
          grep -Fq 'Performance Overlay' "$EMULATION_MENU"
          CONTROL_CENTER="$APP/src/main/java/com/armsx2/ui/settings/TouchStationControlCenter.kt"
          grep -Fq 'TouchStation Control Center' "$CONTROL_CENTER"
          grep -Fq 'currentThermalStatus' "$CONTROL_CENTER"
          grep -Fq 'Export diagnostic report' "$CONTROL_CENTER"
          grep -Fq 'android.hardware.vulkan.level' "$CONTROL_CENTER"
          grep -Fq 'TouchStation Performance Monitor' "$APP/src/main/java/com/armsx2/ui/settings/TouchStationPerformanceMonitor.kt"
          grep -Fq 'The Android FPS tile has no direct bridge sample; use the native in-game overlay for live FPS and frame graphs.' "$APP/src/main/java/com/armsx2/ui/settings/TouchStationPerformanceMonitor.kt"
          grep -Fq 'TouchStationControllerConnectionPanel()' "$APP/src/main/java/com/armsx2/ui/controls/ControllerManagerScreen.kt"
          grep -Fq 'TouchStationControllerWarning' "$APP/src/main/java/com/armsx2/ui/WindowImpl.kt"
          grep -Fq 'Controller disconnected' "$APP/src/main/java/com/armsx2/ui/controls/TouchStationControllerMonitor.kt"
          grep -Fq 'Gameplay requires a physical controller.' "$ABOUT"
          grep -Fq 'text = "TouchStation"' "$APP/src/main/java/com/armsx2/ui/common/ArmsComponents.kt"
          grep -Fq 'boot_splash_logo' "$APP/src/main/res/layout/activity_boot_splash.xml"

      - name: Build TouchStation 10.0.0 Release
        working-directory: ${{ runner.temp }}/armsx3-source/android/armsx3-ui
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGithubRelease

      - name: Verify package, branding, icon, and native engine
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/armsx3-source/android/armsx3-ui/app/build/outputs/apk/github/release/app-github-release.apk"
          test -s "$APK"
          aapt dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "application-label:'TouchStation'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='10.0.0'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionCode='1000'" "$RUNNER_TEMP/badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"

          unzip -Z1 "$APK" > "$RUNNER_TEMP/final-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-core.so" "$RUNNER_TEMP/final-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-jni.so" "$RUNNER_TEMP/final-entries.txt"

          # Release resource shrinking can rename packaged resource paths. Verify
          # the launcher resource produced for this build and then verify the exact
          # icon path Android reports from the compiled package manifest.
          APP_RES="$RUNNER_TEMP/armsx3-source/android/armsx3-ui/app/src/main/res"
          test -s "$APP_RES/mipmap-xxxhdpi/ic_launcher.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$APP_RES/mipmap-$density/ic_launcher.png"
            test -s "$APP_RES/mipmap-$density/ic_launcher_round.png"
          done
          test ! -e "$APP_RES/mipmap-anydpi-v26/ic_launcher.xml"
          test ! -e "$APP_RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          icon_path="$(sed -n "s/^application-icon-640:'\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -n 1)"
          test -n "$icon_path"
          case "$icon_path" in
            *.png) ;;
            *) echo "Launcher manifest did not resolve to a raster PNG: $icon_path"; exit 1 ;;
          esac
          grep -Fxq "$icon_path" "$RUNNER_TEMP/final-entries.txt"
          python - "$APK" "$icon_path" <<'PY'
          import io
          import sys
          import zipfile
          from PIL import Image

          apk_path, icon_path = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(apk_path) as package:
              image = Image.open(io.BytesIO(package.read(icon_path))).convert("RGB")
          pixels = list(image.getdata())
          white = sum(1 for r, g, b in pixels if r > 180 and g > 180 and b > 180)
          black = sum(1 for r, g, b in pixels if r < 30 and g < 30 and b < 30)
          colored = sum(1 for r, g, b in pixels if not (r == g == b))
          if white < 100 or black < len(pixels) // 2 or colored:
              raise SystemExit(
                  "Packaged launcher icon is not the expected black screen with white TOUCHSTATION text: "
                  f"white_pixels={white}, black_pixels={black}, colored_pixels={colored}"
              )
          print(
              f"Verified packaged manifest icon is black with white text only: "
              f"{image.width}x{image.height}; white={white}; black={black}; colored={colored}"
          )
          PY
          if grep -qi '#2370F5' "$APP_RES/drawable/touchstation_icon.xml"; then
            echo "Legacy blue accent detected in TouchStation vector icon."
            exit 1
          fi

          apksigner verify --verbose "$APK"
          zipalign -c -v 4 "$APK"
          ls -lh "$APK"
          cp "$APK" "$RUNNER_TEMP/TouchStation-v10.0.0-arm64.apk"

      - name: Upload TouchStation 10.0.0 APK and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: TouchStation-v10.0.0-arm64
          path: |
            ${{ runner.temp }}/TouchStation-v10.0.0-arm64.apk
            ${{ runner.temp }}/TouchStation-v10.0.0-corresponding-source.tar.gz
            ${{ runner.temp }}/TouchStation-v10.0.0-corresponding-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish TouchStation 10.0.0 Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.0.0
          name: TouchStation 10.0.0 Release
          make_latest: true
          prerelease: false
          overwrite_files: true
          files: |
            ${{ runner.temp }}/TouchStation-v10.0.0-arm64.apk
            ${{ runner.temp }}/TouchStation-v10.0.0-corresponding-source.tar.gz
            ${{ runner.temp }}/TouchStation-v10.0.0-corresponding-source.tar.gz.sha256
          body: |
            TouchStation 10.0.0 Release for Android ARM64.

            - Added device detection for SoC, CPU cores, ABI, Android version, RAM, storage, display refresh rate, OpenGL ES renderer/vendor and Android-reported Vulkan feature level.
            - Added one-tap Performance, Balanced and Quality automatic configurations. PPU and LLVM compile threads are selected conservatively; Safe SPU block size and MSAA Off are used as starting settings.
            - Added an adaptive output-scaling guard based on Android thermal severity and available RAM. This changes the Android output surface, not the game's internal RSX resolution; the pinned native bridge does not expose a closed-loop frame-time callback.
            - Added live thermal severity, available RAM, app PSS and free-storage diagnostics.
            - Added per-game profile application through the upstream global/per-game settings system.
            - Added a compatibility advisor for CPU requirement warnings, ABI, GPU/driver identification and existing upstream game metadata. Device-specific game compatibility remains Unknown until tested.
            - Reused the existing native in-game FPS, frame-time and PPU/SPU/guest-RSX overlay. Physical GPU utilization and unsupported native counters remain N/A.
            - Added a shader cache manager that removes only known compiled Vulkan/OpenGL cache files; it does not remove games, firmware, saves or configuration.
            - Added a conservative Safe Recovery profile and shareable diagnostic report. It does not claim to intercept native process crashes.
            - Added a bounded CPU smoke test; it is not presented as a GPU or PS3 game benchmark.
            - Gameplay remains physical-controller-only. No on-screen gameplay controls are added; touch remains available for menus/settings.

            Corresponding source: download TouchStation-v10.0.0-corresponding-source.tar.gz and verify it with the accompanying .sha256 file. The archive contains the exact pinned upstream source tree, submodules, TouchStation modifications, patch scripts and build workflow for this APK.

            Licensing: TouchStation's downstream work is distributed under GPL-2.0-only. Upstream notices and independent third-party licenses are retained. See THIRD_PARTY_NOTICES.md and SOURCE_DISTRIBUTION.md in the source archive.

            Users must supply official firmware and game files they are legally entitled to use. The native engine remains the pinned upstream ARMSX3 build; this release adds TouchStation Android-side tools and does not claim a from-scratch PS3 core.
