name: TouchStation 5.0.0 Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel an active release build just because another commit was pushed.
concurrency:
  group: touchstation-5-final
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Build TouchStation Android app with native PS3 engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout TouchStation
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # API 37 is published by Google as android-37.0. Gradle 9.4 / AGP
          # resolves compileSdk 37 from platforms/android-37, so add the documented alias.
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" --sdk_root="$SDK_ROOT"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
          echo "$SDK_ROOT/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Install pinned Python image tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/touchstation-python"
          "$RUNNER_TEMP/touchstation-python/bin/pip" install --disable-pip-version-check Pillow==12.0.0
          echo "$RUNNER_TEMP/touchstation-python/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned upstream Android application source
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="$RUNNER_TEMP/armsx3-source"
          COMMIT="482d35b6a9f2eee61cdc6c0820a2d57392b235e6"
          git clone --filter=blob:none --no-checkout https://github.com/ARMSX2/ARMSX3.git "$UPSTREAM"
          git -C "$UPSTREAM" sparse-checkout init --cone
          git -C "$UPSTREAM" sparse-checkout set android/armsx3-ui
          git -C "$UPSTREAM" fetch --depth=1 origin "$COMMIT"
          git -C "$UPSTREAM" checkout --detach FETCH_HEAD
          test -f "$UPSTREAM/android/armsx3-ui/app/src/main/java/com/armsx2/ui/settings/PerformanceTab.kt"
          echo "Upstream source pinned to $COMMIT"

      - name: Download matching upstream ARM64 native libraries
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_APK="$RUNNER_TEMP/armsx3-1.6.4.apk"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/ARMSX2/ARMSX3/releases/download/1.6.4/ARMSX3-1.6.4-a15-armv8.2-sdk35.apk" \
            --output "$UPSTREAM_APK"

          unzip -Z1 "$UPSTREAM_APK" > "$RUNNER_TEMP/upstream-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-core.so" "$RUNNER_TEMP/upstream-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-jni.so" "$RUNNER_TEMP/upstream-entries.txt"
          mkdir -p "$RUNNER_TEMP/native-libs"
          unzip -oq "$UPSTREAM_APK" "lib/arm64-v8a/*.so" -d "$RUNNER_TEMP/native-libs"

          APP="$RUNNER_TEMP/armsx3-source/android/armsx3-ui/app"
          mkdir -p "$APP/src/main/jniLibs/arm64-v8a" "$APP/src/github/jniLibs/arm64-v8a"
          cp "$RUNNER_TEMP/native-libs"/lib/arm64-v8a/*.so "$APP/src/main/jniLibs/arm64-v8a/"
          if [ -f "$APP/src/main/jniLibs/arm64-v8a/libarmsx3_lsfg.so" ]; then
            mv "$APP/src/main/jniLibs/arm64-v8a/libarmsx3_lsfg.so" "$APP/src/github/jniLibs/arm64-v8a/"
          fi

          test -s "$APP/src/main/jniLibs/arm64-v8a/libarmsx3-core.so"
          test -s "$APP/src/main/jniLibs/arm64-v8a/libarmsx3-jni.so"
          test -s "$APP/src/main/jniLibs/arm64-v8a/libEGL_angle.so"
          test -s "$APP/src/main/jniLibs/arm64-v8a/libGLESv2_angle.so"
          echo "Verified and staged native PS3 engine, JNI bridge, and graphics libraries."

      - name: Apply TouchStation branding, controls and chipset settings
        run: |
          python tools/prepare_source_build.py \
            --source "$RUNNER_TEMP/armsx3-source/android/armsx3-ui"

      - name: Build TouchStation 5.0.0
        working-directory: ${{ runner.temp }}/armsx3-source/android/armsx3-ui
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGithubRelease

      - name: Verify package, branding, icon, and native engine
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/armsx3-source/android/armsx3-ui/app/build/outputs/apk/github/release/app-github-release.apk"
          test -s "$APK"
          aapt dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "application-label:'TouchStation'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='5.0.0'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionCode='500'" "$RUNNER_TEMP/badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"

          unzip -Z1 "$APK" > "$RUNNER_TEMP/final-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-core.so" "$RUNNER_TEMP/final-entries.txt"
          grep -Fxq "lib/arm64-v8a/libarmsx3-jni.so" "$RUNNER_TEMP/final-entries.txt"

          # Release resource shrinking can rename packaged resource paths. Verify
          # the launcher resource produced for this build and then verify the exact
          # icon path Android reports from the compiled package manifest.
          APP_RES="$RUNNER_TEMP/armsx3-source/android/armsx3-ui/app/src/main/res"
          test -s "$APP_RES/mipmap-xxxhdpi/ic_launcher.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$APP_RES/mipmap-$density/ic_launcher.png"
            test -s "$APP_RES/mipmap-$density/ic_launcher_foreground.png"
            test -s "$APP_RES/mipmap-$density/ic_launcher_background.png"
          done
          test -s "$APP_RES/mipmap-anydpi-v26/ic_launcher.xml"
          icon_path="$(sed -n "s/^application: label='[^']*' icon='\\([^']*\\)'.*/\\1/p" "$RUNNER_TEMP/badging.txt" | head -n 1)"
          test -n "$icon_path"
          grep -Fxq "$icon_path" "$RUNNER_TEMP/final-entries.txt"
          python - "$APK" "$icon_path" <<'PY'
          import io
          import sys
          import zipfile
          from PIL import Image

          apk_path, icon_path = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(apk_path) as package:
              image = Image.open(io.BytesIO(package.read(icon_path))).convert("RGBA")
          chromatic = [
              pixel for pixel in image.getdata()
              if pixel[3] > 0 and (pixel[0] != pixel[1] or pixel[1] != pixel[2])
          ]
          if chromatic:
              raise SystemExit(
                  f"Launcher icon has {len(chromatic)} colored pixels; expected grayscale only."
              )
          print(f"Verified monochrome launcher image: {icon_path} ({image.width}x{image.height})")
          PY
          if grep -qi '#2370F5' "$APP_RES/drawable/touchstation_icon.xml"; then
            echo "Legacy blue accent detected in TouchStation vector icon."
            exit 1
          fi

          apksigner verify --verbose "$APK"
          zipalign -c -v 4 "$APK"
          ls -lh "$APK"
          cp "$APK" "$RUNNER_TEMP/TouchStation-v5.0.0-arm64.apk"

      - name: Upload TouchStation 4.0.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchStation-v5.0.0-arm64
          path: ${{ runner.temp }}/TouchStation-v4.0.0-arm64.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish TouchStation 5.0.0 Final
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0
          name: TouchStation 5.0.0 Final
          make_latest: true
          prerelease: false
          overwrite_files: true
          files: ${{ runner.temp }}/TouchStation-v5.0.0-arm64.apk
          body: |
            TouchStation 5.0.0 Final for Android ARM64.

            - Removed the blue-accent icon resource and added a monochrome icon verification step.
            - Hid the in-game virtual touchscreen control overlay only; physical gamepad, keyboard and gyro input remain available.
            - Added shader compiler thread control and shader/SPU compile notification options.
            - Retained chipset profiles for Dimensity, Snapdragon and Exynos.
            
            Users must supply firmware and game files they are legally entitled to use.
