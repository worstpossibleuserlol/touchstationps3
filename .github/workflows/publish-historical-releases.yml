name: Publish verified TouchStation releases

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified historical APKs
    runs-on: ubuntu-latest
    steps:
      - name: Download retained successful build artifacts
        env:
          GH_TOKEN: ${{ secrets.TOUCHSTATION_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add a repository Actions secret named TOUCHSTATION_RELEASE_TOKEN with Actions: read and Contents: write access, then run this workflow again."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/touchstation-releases/v2" "$RUNNER_TEMP/touchstation-releases/v4"

          gh run download 42194953384 \
            --repo "$GITHUB_REPOSITORY" \
            --name "touchstation-ps3-2.0.0-debug" \
            --dir "$RUNNER_TEMP/touchstation-releases/v2"

          gh run download 42326385143 \
            --repo "$GITHUB_REPOSITORY" \
            --name "TouchStation-v4.0.0-arm64" \
            --dir "$RUNNER_TEMP/touchstation-releases/v4"

          test -s "$RUNNER_TEMP/touchstation-releases/v2/app-debug.apk"
          test -s "$RUNNER_TEMP/touchstation-releases/v4/TouchStation-v4.0.0-arm64.apk"

          mv "$RUNNER_TEMP/touchstation-releases/v2/app-debug.apk" \
            "$RUNNER_TEMP/touchstation-releases/v2/TouchStation-v2.0.0-beta-debug.apk"

          (
            cd "$RUNNER_TEMP/touchstation-releases/v2"
            sha256sum TouchStation-v2.0.0-beta-debug.apk > TouchStation-v2.0.0-beta-debug.apk.sha256
          )
          (
            cd "$RUNNER_TEMP/touchstation-releases/v4"
            sha256sum TouchStation-v4.0.0-arm64.apk > TouchStation-v4.0.0-arm64.apk.sha256
          )

      - name: Publish TouchStation 2.0.0 Beta
        env:
          GH_TOKEN: ${{ secrets.TOUCHSTATION_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v2.0.0-beta"
          asset_dir="$RUNNER_TEMP/touchstation-releases/v2"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$asset_dir/TouchStation-v2.0.0-beta-debug.apk" \
              "$asset_dir/TouchStation-v2.0.0-beta-debug.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" \
              "$asset_dir/TouchStation-v2.0.0-beta-debug.apk" \
              "$asset_dir/TouchStation-v2.0.0-beta-debug.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "685c19614bc679e28ce4880560bad12ff8f7032a" \
              --title "TouchStation 2.0.0 Beta" \
              --prerelease \
              --notes "Archived early 2.0.0 beta debug build from successful Actions run #10. This APK does not contain the native PS3 engine libraries and cannot boot PS3 games. It is retained as a development prototype, not as the functional PS3 emulator release."
          fi

      - name: Publish TouchStation 4.0.0 Final
        env:
          GH_TOKEN: ${{ secrets.TOUCHSTATION_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v4.0.0"
          asset_dir="$RUNNER_TEMP/touchstation-releases/v4"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$asset_dir/TouchStation-v4.0.0-arm64.apk" \
              "$asset_dir/TouchStation-v4.0.0-arm64.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" \
              "$asset_dir/TouchStation-v4.0.0-arm64.apk" \
              "$asset_dir/TouchStation-v4.0.0-arm64.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "1f45eae31bd5cfb59058a0e6e3d2580a6ddbd31a" \
              --title "TouchStation 4.0.0 Final" \
              --notes "TouchStation 4.0.0 Final for Android ARM64. This verified build includes the native PS3 engine libraries from the pinned upstream ARMSX3 Android release, plus TouchStation branding and chipset-family tuning guidance. Minimum Android version: 8.0 (API 26). This APK is ARM64 only. No Sony firmware or commercial games are included; users must supply files they are legally entitled to use. See the repository LICENSE and THIRD_PARTY_NOTICES.md."
          fi
